<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>桌游计分器</title> <!-- 更改：更新标题 -->
    <link rel="icon" href="favicon.png" type="image/png">
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Inter 字体 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        /* 使用 Inter 字体作为基础字体 */
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji";
        }
        
        /* 更改：为 WINGSPAN 添加独立的获胜者样式 */
        .winner-col-ws {
            background-color: #FEF9C3; /* yellow-200 */
        }
        /* 新增：为 PARKS 添加独立的获胜者样式 */
        .winner-col-parks {
            background-color: #FDE68A; /* amber-300 */
        }

        /* 优化数字输入框在 Webkit 浏览器上的显示 (移除小箭头) */
        input[type='number']::-webkit-inner-spin-button,
        input[type='number']::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type='number'] {
            -moz-appearance: textfield; /* 移除 Firefox 上的小箭头 */
        }
        /* 表格输入框样式 */
        .table-input {
            width: 70px; /* 固定宽度，因为现在是垂直的 */
            padding: 8px 4px;
            border: 1px solid #D1D5DB; /* gray-300 */
            border-radius: 6px;
            text-align: center;
            font-size: 1.125rem; /* text-sm */
        }
        .table-input:focus {
            border-color: #3B82F6; /* blue-500 */
            box-shadow: 0 0 0 2px #BFDBFE; /* blue-200 */
            outline: none;
        }
        /* 玩家名字输入框 */
        .player-name-input {
            width: 70px;
            text-align: center;
            font-weight: bold;
            font-size: 1.125rem;
            border: 2px solid transparent;
            border-radius: 6px;
            padding: 4px;
        }
        .player-name-input:focus {
            border-color: #3B82F6; /* blue-500 */
            outline: none;
        }

        /* 移动端优化 */
        @media (max-width: 640px) {
            .table-input {
                width: 50px;
                font-size: 0.875rem;
            }
            .player-name-input {
                width: 50px;
                font-size: 0.875rem;
            }
        }
    </style>
</head>
<body class="bg-stone-100 min-h-screen"> <!-- 更改：更自然的背景色 -->

    <!-- 1. 顶部控制栏 -->
    <header class="bg-white p-4 shadow-md sticky top-0 z-20">
        <div class="container mx-auto flex flex-wrap justify-between items-center gap-4">
            <h1 class="text-2xl font-bold text-teal-800">
                🎲 桌游计分器
                <br>
                <span class="text-base font-normal text-gray-600">Wingspan + Parks 2</span>
            </h1>
            <!-- 移除了全局的添加/重置按钮 -->
        </div>
    </header>

    <!-- 2. WINGSPAN 计分器部分 -->
    <section id="wingspan-section" class="p-4 md:p-6">
        <!-- 更改：添加了 Wingspan 的专属控制栏 -->
        <div class="flex flex-wrap justify-between items-center mb-4 gap-4">
            <h2 class="text-xl font-bold text-teal-700">🐦 展仪翱翔 (Wingspan)</h2>
            <div class="flex gap-3 flex-shrink-0">
                <button id="ws-add-player" class="bg-sky-600 hover:bg-sky-700 text-white font-bold py-2 px-4 rounded transition-colors">
                    ＋ 添加玩家
                </button>
                <button id="ws-reset-game" class="bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-4 rounded transition-colors">
                    🔄 重置游戏
                </button>
            </div>
        </div>
        
        <!-- Wingspan 计分表格 -->
        <div class="overflow-x-auto bg-white rounded-lg shadow-lg">
            <table class="w-full min-w-max" id="wingspan-score-table">
                <!-- 更改：所有 ID 添加 'ws-' 前缀 -->
                <thead>
                    <tr id="ws-remove-row" class="bg-stone-100 border-b border-gray-200">
                        <th class="p-2 sticky left-0 bg-stone-100/75 backdrop-blur-sm text-sm font-medium text-gray-600 z-10">移除玩家</th>
                    </tr>
                    <tr id="ws-player-name-row" class="text-gray-700"> <!-- JS 会应用主题 -->
                        <th class="p-4 text-left text-sm font-bold sticky left-0 z-10">
                            <span class="theme-placeholder">计分项</span>
                        </th>
                    </tr>
                </thead>
                <tbody>
                    <tr class="border-b border-gray-200">
                        <td class="p-4 text-sm font-medium sticky left-0 bg-white/75 backdrop-blur-sm">🐦鸟牌总分</td>
                    </tr>
                    <tr class="border-b border-gray-200">
                        <td class="p-4 text-sm font-medium sticky left-0 bg-white/75 backdrop-blur-sm">⭐奖励卡分</td>
                    </tr>
                    <tr class="border-b border-gray-200">
                        <td class="p-4 text-sm font-medium sticky left-0 bg-white/75 backdrop-blur-sm">🏆轮末目标</td>
                    </tr>
                    <tr class="border-b border-gray-200">
                        <td class="p-4 text-sm font-medium sticky left-0 bg-white/75 backdrop-blur-sm">🥚鸟蛋总分</td>
                    </tr>
                    <tr class="border-b border-gray-200">
                        <td class="p-4 text-sm font-medium sticky left-0 bg-white/75 backdrop-blur-sm">🍇贮藏食物</td>
                    </tr>
                    <tr class="border-b border-gray-200">
                        <td class="p-4 text-sm font-medium sticky left-0 bg-white/75 backdrop-blur-sm">🔀塞入卡片</td>
                    </tr>
                </tbody>
                <tfoot>
                    <tr id="ws-total-row"> <!-- JS 会应用主题 -->
                        <td class="p-4 text-sm font-bold sticky left-0 z-10">
                            <span class="total-text-placeholder text-amber-900">👑 总分</span>
                        </td>
                    </tr>
                </tfoot>
            </table>
        </div>
        <!-- Wingspan 播报按钮 -->
        <div class="flex justify-end mt-4">
            <button id="ws-announce-winner" class="bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 px-6 rounded-lg shadow-lg transition-all hover:scale-105">
                🎉 播报获胜者
            </button>
        </div>
    </section>

    <!-- 页面分隔线 -->
    <hr class="container mx-auto border-t-2 border-stone-300 my-4">

    <!-- 3. PARKS 计分器部分 -->
    <section id="parks-section" class="p-4 md:p-6">
        <!-- ... (PARKS header) ... -->
        <div class="flex flex-wrap justify-between items-center mb-4 gap-4">
            <h2 class="text-xl font-bold text-green-800">🌲 国家公园 2 (PARKS 2)</h2>
            <div class="flex gap-3 flex-shrink-0">
                <button id="parks-add-player" class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded transition-colors">
                    ＋ 添加玩家
                </button>
                <button id="parks-reset-game" class="bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-4 rounded transition-colors">
                    🔄 重置游戏
                </button>
            </div>
        </div>

        <!-- 新增：PARKS 计分表格 -->
        <div class="overflow-x-auto bg-white rounded-lg shadow-lg">
            <table class="w-full min-w-max" id="parks-score-table">
                <!-- ... (PARKS thead) ... -->
                <thead>
                    <tr id="parks-remove-row" class="bg-stone-100 border-b border-gray-200">
                        <th class="p-2 sticky left-0 bg-stone-100/75 backdrop-blur-sm text-sm font-medium text-gray-600 z-10">移除玩家</th>
                    </tr>
                    <tr id="parks-player-name-row" class="text-gray-700"> <!-- JS 会应用主题 -->
                        <th class="p-4 text-left text-sm font-bold sticky left-0 z-10">
                             <span class="theme-placeholder">计分项</span>
                        </th>
                    </tr>
                </thead>
                <!-- 更改：PARKS 计分项已根据规则更新 -->
                <tbody>
                    <tr class="border-b border-gray-200">
                        <td class="p-4 text-sm font-medium sticky left-0 bg-white/75 backdrop-blur-sm">🌲公园总分</td>
                    </tr>
                    <tr class="border-b border-gray-200">
                        <td class="p-4 text-sm font-medium sticky left-0 bg-white/75 backdrop-blur-sm">🧑个人目标</td>
                    </tr>
                    <tr class="border-b border-gray-200">
                        <td class="p-4 text-sm font-medium sticky left-0 bg-white/75 backdrop-blur-sm">🖼️照片总分</td>
                    </tr>
                    <tr class="border-b border-gray-200">
                        <td class="p-4 text-sm font-medium sticky left-0 bg-white/75 backdrop-blur-sm">📷照片奖励</td>
                    </tr>
                    <tr class="border-b border-gray-200">
                        <td class="p-4 text-sm font-medium sticky left-0 bg-white/75 backdrop-blur-sm">📅季节奖励</td>
                    </tr>
                    <tr class="border-b border-gray-200">
                        <td class="p-4 text-sm font-medium sticky left-0 bg-white/75 backdrop-blur-sm">🎖️起始玩家</td>
                    </tr>
                </tbody>
                <tfoot>
                    <tr id="parks-total-row"> <!-- JS 会应用主题 -->
                        <td class="p-4 text-sm font-bold sticky left-0 z-10">
                            <span class="total-text-placeholder text-orange-900">👑 总分</span>
                        </td>
                    </tr>
                </tfoot>
            </table>
        </div>
        <!-- PARKS 播报按钮 -->
        <div class="flex justify-end mt-4">
            <button id="parks-announce-winner" class="bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 px-6 rounded-lg shadow-lg transition-all hover:scale-105">
                🎉 播报获胜者
            </button>
        </div>
    </section>


    <!-- 4. 底部提示 -->
    <footer class="text-center p-6 text-gray-500 text-sm">
        <p>祝您游戏愉快！</p>
        <!-- 更改：添加 PARKS 平局规则 -->
        <p class="mt-1">Wingspan平局提示：平局时，剩余食物最多者获胜。</p>
    </footer>

    <!-- 5. JavaScript 逻辑 (无功能性更改，它会自动适配新的行) -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            
            // --- WINGSPAN 配置 ---
            const wsConfig = {
                tableId: 'wingspan-score-table',
                addPlayerBtnId: 'ws-add-player',
                announceWinnerBtnId: 'ws-announce-winner',
                resetGameBtnId: 'ws-reset-game',
                playerNameRowId: 'ws-player-name-row',
                removeRowId: 'ws-remove-row',
                totalRowId: 'ws-total-row',
                defaultPlayerPrefix: '玩家',
                theme: {
                    playerRow: 'bg-cyan-100',
                    playerRowSticky: 'bg-cyan-100/75',
                    totalRow: 'bg-amber-100',
                    totalRowSticky: 'bg-amber-100/75',
                    totalText: 'text-amber-900',
                    winnerCol: 'winner-col-ws'
                }
            };

            // --- PARKS 配置 ---
            const parksConfig = {
                tableId: 'parks-score-table',
                addPlayerBtnId: 'parks-add-player',
                announceWinnerBtnId: 'parks-announce-winner',
                resetGameBtnId: 'parks-reset-game',
                playerNameRowId: 'parks-player-name-row',
                removeRowId: 'parks-remove-row',
                totalRowId: 'parks-total-row',
                defaultPlayerPrefix: 'Hiker',
                theme: {
                    playerRow: 'bg-green-100', // 森林
                    playerRowSticky: 'bg-green-100/75',
                    totalRow: 'bg-orange-100', // 日落
                    totalRowSticky: 'bg-orange-100/75',
                    totalText: 'text-orange-900',
                    winnerCol: 'winner-col-parks'
                }
            };

            /**
             * 核心函数：初始化一个计分表
             * @param {object} config - 包含所有 ID 和主题配置的对象
             */
            function initializeScoreTable(config) {
                const table = document.getElementById(config.tableId);
                if (!table) return;

                const theadRow = document.getElementById(config.playerNameRowId);
                const theadRemoveRow = document.getElementById(config.removeRowId);
                const tbodyRows = table.querySelectorAll('tbody tr');
                const tfootTotalRow = document.getElementById(config.totalRowId);
                const addPlayerBtn = document.getElementById(config.addPlayerBtnId);
                const announceWinnerBtn = document.getElementById(config.announceWinnerBtnId);
                const resetGameBtn = document.getElementById(config.resetGameBtnId);
                
                let playerCount = 0;
                const WINNER_CLASS = config.theme.winnerCol;
                
                // 新增：为每个表格创建独立的音乐播放标记
                let isMusicPlaying = false;

                // --- 动态应用主题 ---
                theadRow.classList.add(config.theme.playerRow);
                theadRow.querySelector('th').classList.add(config.theme.playerRowSticky);
                tfootTotalRow.classList.add(config.theme.totalRow);
                tfootTotalRow.querySelector('td').classList.add(config.theme.totalRowSticky);
                tfootTotalRow.querySelector('.total-text-placeholder').classList.add(config.theme.totalText);

                
                /**
                 * 添加一个新玩家 (一整列)
                 */
                function robustAddPlayer() {
                    const playerNum = getNextPlayerNumber();
                    
                    // 1. 添加表头 (玩家名字)
                    const th = document.createElement('th');
                    th.className = 'p-2';
                    const playerNameInput = document.createElement('input');
                    playerNameInput.type = 'text';
                    playerNameInput.value = `${config.defaultPlayerPrefix} ${playerNum}`;
                    playerNameInput.className = 'player-name-input';
                    
                    playerNameInput.addEventListener('focus', function() {
                        this.setAttribute('data-placeholder', this.value);
                        this.value = '';
                    });
                    playerNameInput.addEventListener('blur', function() {
                        if (this.value.trim() === '') {
                            this.value = this.getAttribute('data-placeholder');
                        }
                        this.removeAttribute('data-placeholder');
                    });
                    th.appendChild(playerNameInput);
                    theadRow.appendChild(th);

                    // 2. 为每个计分项添加输入框 (tbody)
                    // (此代码会自动查找所有 tbody tr, 包括我们新加的行)
                    tbodyRows.forEach(row => {
                        const td = document.createElement('td');
                        td.className = 'p-2 text-center';
                        const input = document.createElement('input');
                        input.type = 'number';
                        input.min = '0';
                        input.value = '0';
                        input.className = 'score-input table-input';
                        input.addEventListener('input', (e) => {
                            robustUpdateScore(e.target);
                            saveGameState(); // 添加这行
                        });
                        input.addEventListener('wheel', (e) => {
                            e.preventDefault();
                            let value = parseInt(input.value) || 0;
                            if (e.deltaY < 0) value++; else value--;
                            input.value = Math.max(0, value);
                            robustUpdateScore(e.target);
                            saveGameState(); // 更改：滚轮调整后保存状态
                        });
                        input.addEventListener('focus', function() {
                            if (this.value === '0') this.value = '';
                            else this.select();
                        });
                        input.addEventListener('blur', function() {
                            if (this.value.trim() === '') this.value = '0';
                            robustUpdateScore(this);
                            saveGameState(); // 更改：失去焦点后保存状态
                        });
                        // 新增：处理 Enter 和 ArrowDown 键
                        input.addEventListener('keydown', (e) => {
                            if (e.key === 'Enter' || e.key === 'ArrowDown') {
                                e.preventDefault();
                                // 跳转到下一个输入框
                                const currentRow = input.closest('tr');
                                const nextRow = currentRow.nextElementSibling;
                                if (nextRow) {
                                    const nextInput = nextRow.children[input.closest('td').cellIndex]?.querySelector('.score-input');
                                    if (nextInput) nextInput.focus();
                                }
                            } else if (e.key === 'ArrowUp') {
                                e.preventDefault();
                                const currentRow = input.closest('tr');
                                const prevRow = currentRow.previousElementSibling;
                                if (prevRow) {
                                    const prevInput = prevRow.children[input.closest('td').cellIndex]?.querySelector('.score-input');
                                    if (prevInput) prevInput.focus();
                                }
                            }
                        });
                        td.appendChild(input);
                        row.appendChild(td);
                    });

                    // 3. 添加总分单元格 (tfoot)
                    const totalTd = document.createElement('td');
                    totalTd.className = 'p-3 text-center';
                    totalTd.innerHTML = `<span class="total-score text-4xl font-black ${config.theme.totalText}">0</span>`;
                    tfootTotalRow.appendChild(totalTd);

                    // 4. 添加移除按钮单元格 (thead)
                    const removeTh = document.createElement('th');
                    removeTh.className = 'p-3 text-center';
                    const removeBtn = document.createElement('button');
                    removeBtn.className = 'remove-player text-red-500 hover:text-red-700 font-bold text-2xl transition-colors';
                    removeBtn.title = '移除玩家';
                    removeBtn.innerHTML = '&times;';
                    // 更改：移除玩家时保存状态
                    removeBtn.addEventListener('click', (e) => {
                        robustRemovePlayer(e.target);
                        saveGameState();
                    });
                    removeTh.appendChild(removeBtn);
                    theadRemoveRow.appendChild(removeTh);

                    highlightWinners();
                }

                /**
                 * 移除一个玩家 (一整列)
                 */
                function robustRemovePlayer(button) {
                    const colIndex = button.closest('th').cellIndex;
                    if (colIndex > 0) {
                        table.querySelectorAll('tr').forEach(row => {
                            if (row.children[colIndex]) {
                                row.removeChild(row.children[colIndex]);
                            }
                        });
                        highlightWinners();
                    }
                }
                
                /**
                 * 更新一个玩家的总分
                 */
                function robustUpdateScore(input) {
                    const colIndex = input.closest('td').cellIndex;
                    if (colIndex > 0) {
                        let total = 0;
                        tbodyRows.forEach(row => {
                            const cell = row.children[colIndex];
                            if (cell) {
                                const scoreInput = cell.querySelector('.score-input');
                                total += parseInt(scoreInput.value) || 0;
                            }
                        });

                        const totalCell = tfootTotalRow.children[colIndex];
                        if (totalCell) {
                            totalCell.querySelector('.total-score').textContent = total;
                        }
                        highlightWinners();
                    }
                }

                /**
                 * 高亮显示得分最高的玩家列
                 */
                function highlightWinners() {
                    const totalCells = tfootTotalRow.querySelectorAll('td');
                    let maxScore = -1;
                    const scores = [];

                    if (totalCells.length <= 1) return;

                    for (let i = 1; i < totalCells.length; i++) {
                        const total = parseInt(totalCells[i].textContent) || 0;
                        scores.push(total);
                        if (total > maxScore) maxScore = total;
                    }
                    
                    const effectiveMaxScore = maxScore > 0 ? maxScore : -1;

                    // 新增：收集获胜者名字
                    const winners = [];

                    scores.forEach((score, index) => {
                        const colIndex = index + 1;
                        if (score === effectiveMaxScore) {
                            table.querySelectorAll('tr').forEach(row => {
                                if(row.children[colIndex]) row.children[colIndex].classList.add(WINNER_CLASS);
                            });
                        } else {
                            table.querySelectorAll('tr').forEach(row => {
                                if(row.children[colIndex]) row.children[colIndex].classList.remove(WINNER_CLASS);
                            });
                        }
                    });
                }

                /**
                 * 获取当前获胜者列表
                 */
                function getWinners() {
                    const totalCells = tfootTotalRow.querySelectorAll('td');
                    let maxScore = -1;
                    const winners = [];

                    if (totalCells.length <= 1) return winners;

                    for (let i = 1; i < totalCells.length; i++) {
                        const total = parseInt(totalCells[i].textContent) || 0;
                        if (total > maxScore) maxScore = total;
                    }
                    
                    if (maxScore <= 0) return winners;

                    for (let i = 1; i < totalCells.length; i++) {
                        const total = parseInt(totalCells[i].textContent) || 0;
                        if (total === maxScore) {
                            const playerNameInput = theadRow.children[i]?.querySelector('input');
                            if (playerNameInput) {
                                winners.push(playerNameInput.value);
                            }
                        }
                    }
                    return winners;
                }

                /**
                 * 新增：语音播报获胜者名字
                 */
                function announceWinners(winners) {
                    // 使用局部变量而非全局变量
                    if (isMusicPlaying || window.speechSynthesis.speaking) {
                        window.speechSynthesis.cancel();
                    }
                    isMusicPlaying = true;

                    let message = '';
                    if (winners.length === 1) {
                        message = `恭喜 ${winners[0]} 获得本场胜利，斩获MVP，成为牛逼Plus闪耀新星！`;
                    } else {
                        const names = winners.join('、');
                        message = `平局！恭喜 ${names} 并列第一！`;
                    }

                    const utterance = new SpeechSynthesisUtterance(message);
                    utterance.lang = 'zh-CN';
                    utterance.rate = 0.9;
                    utterance.pitch = 1.1;
                    utterance.volume = 0.8;

                    utterance.onend = () => {
                        // 播报结束后立即播放音乐
                        setTimeout(() => {
                            playVictoryMusic();
                        }, 200);
                    };

                    utterance.onerror = () => {
                        // 如果播报出错，直接播放音乐
                        playVictoryMusic();
                    };

                    window.speechSynthesis.speak(utterance);
                }

                /**
                 * 新增：播放胜利庆祝音乐 - 使用 HTML5 Audio（iOS 兼容）
                 */
                function playVictoryMusic() {
                    // 防止重复播放
                    if (isMusicPlaying === 'playing') return;
                    isMusicPlaying = 'playing';
                    
                    // 使用 HTML5 Audio 播放胜利音效
                    // 这是一个简短的胜利音效，使用 data URL 嵌入
                    const audio = new Audio();
                    
                    // 尝试使用 Web Audio API 生成音频并转换为可播放格式
                    try {
                        const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                        const sampleRate = audioContext.sampleRate;
                        const duration = 3.5;
                        const numSamples = sampleRate * duration;
                        const audioBuffer = audioContext.createBuffer(1, numSamples, sampleRate);
                        const channelData = audioBuffer.getChannelData(0);
                        
                        // 生成胜利旋律
                        const notes = [
                            { freq: 523.25, start: 0.0, duration: 0.15 },
                            { freq: 587.33, start: 0.15, duration: 0.15 },
                            { freq: 659.25, start: 0.3, duration: 0.15 },
                            { freq: 698.46, start: 0.45, duration: 0.15 },
                            { freq: 783.99, start: 0.6, duration: 0.2 },
                            { freq: 783.99, start: 0.85, duration: 0.2 },
                            { freq: 783.99, start: 1.1, duration: 0.3 },
                            { freq: 659.25, start: 1.5, duration: 0.15 },
                            { freq: 698.46, start: 1.65, duration: 0.15 },

                            { freq: 659.25, start: 2.45, duration: 0.2 },
                            { freq: 523.25, start: 2.7, duration: 0.4 }
                        ];
                        
                        notes.forEach(note => {
                            const startSample = Math.floor(note.start * sampleRate);
                            const endSample = Math.floor((note.start + note.duration) * sampleRate);
                            
                            for (let i = startSample; i < endSample && i < numSamples; i++) {
                                const t = (i - startSample) / sampleRate;
                                const envelope = Math.min(1, t / 0.02) * Math.max(0, 1 - (t - note.duration + 0.1) / 0.1);
                                channelData[i] += Math.sin(2 * Math.PI * note.freq * t) * envelope * 0.3;
                            }
                        });
                        
                        // 使用离线渲染直接播放
                        const source = audioContext.createBufferSource();
                        source.buffer = audioBuffer;
                        source.connect(audioContext.destination);
                        
                        // 确保 iOS 上 AudioContext 已恢复
                        if (audioContext.state === 'suspended') {
                            audioContext.resume().then(() => {
                                source.start(0);
                            });
                        } else {
                            source.start(0);
                        }
                        
                        // 重置标记
                        setTimeout(() => {

                        }, 3500);

                // 改进：动态计算玩家编号
                function getNextPlayerNumber() {
                    const existingPlayers = Array.from(theadRow.querySelectorAll('input'))
                        .map(input => input.value)
                        .filter(name => name.startsWith(config.defaultPlayerPrefix));
                    
                    let maxNum = 0;
                    existingPlayers.forEach(name => {
                        const match = name.match(/\d+$/);
                        if (match) {
                            const num = parseInt(match[0]);
                            if (num > maxNum) maxNum = num;
                        }
                    });
                    return maxNum + 1;
                }

                // --- 重置游戏分数 ---
                function robustResetGame() {
                    const numPlayerCols = theadRow.children.length - 1;
                    
                    for (let colIndex = 1; colIndex <= numPlayerCols; colIndex++) {
                        tbodyRows.forEach(row => {
                            const cell = row.children[colIndex];
                            if (cell) {
                                const input = cell.querySelector('.score-input');
                                if (input) input.value = '0';
                            }
                        });
                        
                        const totalCell = tfootTotalRow.children[colIndex];
                        if (totalCell) {
                            totalCell.querySelector('.total-score').textContent = '0';
                        }
                    }
                    highlightWinners();
                }

                // --- 保存游戏状态 ---
                function saveGameState() {
                    const state = {
                        playerCount,
                        players: [],
                        scores: []
                    };
                    
                    // 保存玩家名字
                    theadRow.querySelectorAll('input').forEach(input => {
                        state.players.push(input.value);
                    });
                    
                    // 保存分数
                    tbodyRows.forEach(row => {
                        const rowScores = [];
                        row.querySelectorAll('.score-input').forEach(input => {
                            rowScores.push(input.value);
                        });
                        state.scores.push(rowScores);
                    });
                    
                    localStorage.setItem(`game_${config.tableId}`, JSON.stringify(state));
                }

                function loadGameState() {
                    const saved = localStorage.getItem(`game_${config.tableId}`);
                    if (saved) {
                        const state = JSON.parse(saved);
                        // 更改：重置计数器，因为 robustAddPlayer 会重新增加它
                        playerCount = 0; 
                        
                        // 清除现有玩家
                        while (theadRow.children.length > 1) {
                            robustRemovePlayer(theadRemoveRow.children[1].querySelector('button'));
                        }
                        
                        // 恢复玩家
                        for (let i = 0; i < state.players.length; i++) {
                            robustAddPlayer();
                            theadRow.children[i + 1].querySelector('input').value = state.players[i];
                        }
                        
                        // 恢复分数
                        state.scores.forEach((rowScores, rowIndex) => {
                            rowScores.forEach((score, colIndex) => {
                                const input = tbodyRows[rowIndex].children[colIndex + 1]?.querySelector('.score-input');
                                if (input) {
                                    input.value = score;
                                    robustUpdateScore(input);
                                }
                            });
                        });
                    }
                }

                // --- 初始化此表格 ---
                loadGameState(); // 先加载状态
                if (theadRow.children.length === 1) {
                    // 如果没有保存的数据，添加默认玩家
                    robustAddPlayer();
                    robustAddPlayer();
                }

                addPlayerBtn.addEventListener('click', () => {
                    robustAddPlayer();
                    saveGameState();
                });
                announceWinnerBtn.addEventListener('click', () => {
                    const winners = getWinners();
                    if (winners.length > 0) {
                        announceWinners(winners);
                    } else {
                        alert('还没有获胜者，请先输入分数！');
                    }
                });
                resetGameBtn.addEventListener('click', () => {
                    robustResetGame();
                    saveGameState();
                });

                // 更改：移除了此处多余的 robustAddPlayer() 调用，防止刷新后玩家翻倍
            }

            // --- 启动两个计分器 ---
            initializeScoreTable(wsConfig);
            initializeScoreTable(parksConfig);
        });
